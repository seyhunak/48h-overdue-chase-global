# ClearDue nginx site — copy to /etc/nginx/sites-available/cleardue, symlink to
# sites-enabled, replace YOUR_DOMAIN, then: certbot --nginx -d YOUR_DOMAIN
# Assumes: docker compose app on 127.0.0.1:3000 (see docker-compose.yml).

upstream cleardue {
  server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  # Let's Encrypt challenge path (certbot manages the cert lines below).
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # Everything else -> Next.js.
  location / {
    proxy_pass http://cleardue;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Next.js static assets: cache hard, immutable hashed filenames.
  location /_next/static/ {
    proxy_pass http://cleardue;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Gzip small text responses (JSON/HTML/CSS/JS) to spare the 1 GB box.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
